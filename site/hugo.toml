baseURL = 'https://psck.github.io/blog/'
title = "Marcin's Blog"
theme = 'congo'
defaultContentLanguage = 'en'

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  colorScheme = "congo"
  defaultAppearance = "auto"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true

  [params.header]
    layout = "basic"
    showTitle = true

  [params.footer]
    showCopyright = true
    showThemeAttribution = false
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.homepage]
    layout = "profile"
    showRecent = true
    recentLimit = 5

  [params.article]
    showDate = true
    showAuthor = true
    showBreadcrumbs = true
    showHeadingAnchors = true
    showPagination = true
    showReadingTime = true
    showTableOfContents = true
    showTaxonomies = true
    showWordCount = false

  [params.author]
    name = "Marcin"
    headline = "Software Delivery, AI Systems & Context Engineering"
    bio = "Notes on software delivery across enterprise kitchens, agent memory, and systems engineering."

[menu]
  [[menu.main]]
    name = "Posts"
    pageRef = "posts"
    weight = 10

  [[menu.main]]
    name = "Tags"
    pageRef = "tags"
    weight = 20

  [[menu.main]]
    identifier = "search"
    weight = 99
    [menu.main.params]
      action = "search"
